services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
  # Optional database for the subsequent integration milestone.
  postgres:
    image: postgres:16-alpine
    profiles: ["storage"]
    environment:
      POSTGRES_DB: alfa_impact
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only_not_for_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
volumes:
  pgdata:
